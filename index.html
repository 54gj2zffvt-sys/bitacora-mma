<style>
:root{
  --bg:#F7F8F9; --surface:#FFFFFF; --fg:#0B1114; --muted:#5B6670;
  --accent:#00C98A; --accent-ink:#06130F; --success:#16EC06; --border:#E4E7EA;
  --mid:#FFDE00; --danger:#FF0026;
  --session-striking:#0093E7; --session-grappling:#7BA1BB;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --bg-grad:linear-gradient(180deg,#283339,#101518);
    --surface:#1A2025; --fg:#FFFFFF; --muted:#8C9AA3;
    --accent:#00F19F; --accent-ink:#06130F; --success:#16EC06; --border:#2A3238;
    --mid:#FFDE00; --danger:#FF0026;
    --session-striking:#0093E7; --session-grappling:#7BA1BB;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg-grad, var(--bg)); background-color:var(--bg); color:var(--fg); font-family:'Work Sans',system-ui,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:20px 48px; max-width:600px; margin:0 auto;
}
h1{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.02em;font-size:28px;margin:2px 0 14px;font-weight:600}
.eyebrow{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--accent);font-weight:600}
.weeknav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.nav{background:var(--surface);border:1px solid var(--border);color:var(--fg);width:34px;height:34px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer}
.weekrange{font-weight:600;font-size:14px;min-width:132px;text-align:center;font-variant-numeric:tabular-nums}
.ring-wrap{position:relative;display:flex;justify-content:center;margin:4px 0 22px}
.ring-progress{transition:stroke-dashoffset .5s ease}
.ring-center{position:absolute;top:0;left:0;width:140px;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num{font-family:'Oswald',sans-serif;font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.ring-sub{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.tab{position:relative;height:52px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--muted);font-family:'Oswald',sans-serif;font-weight:600;overflow:hidden}
.tab-label{position:relative;z-index:2}
.tab-fill{position:absolute;left:0;bottom:0;width:100%;height:var(--fill,0%);background:var(--accent);opacity:.25;z-index:1;transition:height .4s ease}
.tab.active{border-color:var(--accent);color:var(--fg)}
.tab.active .tab-label{color:var(--accent)}
.tab.done{color:var(--accent)}
.block{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
.block-title{font-family:'Oswald',sans-serif;text-transform:uppercase;font-weight:600;font-size:14px;letter-spacing:.04em;color:var(--accent);margin-bottom:12px}
.items{display:flex;flex-direction:column;gap:9px}
.item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--border);border-radius:12px;transition:border-color .25s ease}
.item.checked{border-color:var(--accent)}
.box{width:22px;height:22px;flex:none;border:2px solid var(--border);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#06130F;background:var(--surface);cursor:pointer;transition:background .2s ease,border-color .2s ease}
.item.checked .box{background:var(--accent);border-color:var(--accent)}
.item-text{font-size:13.5px;line-height:1.3;flex:1;cursor:pointer}
.item.checked .item-text{color:var(--muted);text-decoration:line-through}
.vidbtn{flex:none;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;letter-spacing:.03em;padding:7px 10px;cursor:pointer;white-space:nowrap}
.vidbtn.pending{background:transparent;color:var(--muted);border:1px dashed var(--border)}
.daysched{color:var(--muted);font-size:12px;margin:-6px 0 16px}
.history{margin-bottom:14px}
.history-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:'Oswald',sans-serif}
.history-row{display:flex;gap:10px;align-items:flex-end;height:60px}
.hbar{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.hbar-track{width:100%;height:40px;background:var(--border);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.hbar-fill{width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.hbar-label{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ft{text-align:center;color:var(--muted);font-size:11px;margin-top:6px}
.note-input{width:100%;min-height:56px;margin-top:-2px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-family:'Work Sans',sans-serif;font-size:13px;padding:8px;resize:vertical}
.year-scroll{overflow-x:auto;padding-bottom:4px}
.year-months{display:flex;gap:2px;margin-bottom:4px;height:12px}
.year-month-label{width:11px;flex:none;font-size:9px;color:var(--muted);white-space:nowrap;overflow:visible}
.year-grid{display:flex;gap:2px}
.ycol{display:flex;flex-direction:column;gap:2px}
.ycell{width:11px;height:11px;border-radius:3px;background:var(--border)}
.ycell.red{background:var(--danger)}
.ycell.orange{background:#FF8A1F}
.ycell.yellow{background:var(--mid)}
.ycell.green{background:var(--success)}
.ycell.future{background:var(--border);opacity:.35}
.ycell.none{background:var(--border);opacity:.8}
.ycell.empty{background:transparent}
.year-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.year-legend .ycell{width:10px;height:10px;display:inline-block;border-radius:2px}
.year-toggle{width:100%;background:none;border:none;color:var(--accent);font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.03em;text-align:left;cursor:pointer;padding:0;margin-bottom:10px}
.dayoverride{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:14px;flex-wrap:wrap}
.dayoverride-q{font-size:12.5px;color:var(--fg);flex:1;min-width:180px}
.dayoverride-btns{display:flex;gap:6px;flex:none}
.ov-btn{background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:7px;font-family:'Oswald',sans-serif;font-weight:600;font-size:11px;padding:6px 12px;cursor:pointer}
.ov-btn.active-yes{background:var(--success);border-color:var(--success);color:#06130F}
.ov-btn.active-no{background:var(--danger);border-color:var(--danger);color:#fff}
.sync-toggle{width:100%;background:none;border:none;color:var(--accent);font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.03em;text-align:left;cursor:pointer;padding:0}
.sync-body{padding-top:12px;display:flex;flex-direction:column;gap:10px}
.sync-hint{font-size:12px;color:var(--muted);line-height:1.4}
.sync-body textarea{width:100%;min-height:64px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:8px;resize:vertical}
.sync-btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;padding:9px 12px;cursor:pointer}
.sync-status{font-size:11.5px;color:var(--success);min-height:14px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal-backdrop[hidden]{display:none}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;overflow:hidden}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.modal-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;text-transform:uppercase}
.modal-close{background:none;border:none;color:var(--fg);font-size:20px;cursor:pointer;line-height:1}
.modal-body{aspect-ratio:16/9;background:#000}
.modal-body iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:380px){ h1{font-size:24px} }
</style>
</head>

function pad(n){ return n<10 ? '0'+n : ''+n; }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function mondayForOffset(offset){
  var now = new Date();
  var dow = now.getDay();
  var diffToMonday = (dow === 0 ? -6 : 1 - dow);
  var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  monday.setDate(monday.getDate() + diffToMonday + offset*7);
  return monday;
}
function weekKeyForOffset(offset){ return isoDate(mondayForOffset(offset)); }
function todayKey(){
  var map = ['sun','mon','tue','wed','thu','fri','sat'];
  return map[new Date().getDay()];
}
function mondayOfDate(d){
  var dow = d.getDay();
  var diffToMonday = (dow === 0 ? -6 : 1 - dow);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()+diffToMonday);
}
function weekKeyOfDate(d){ return isoDate(mondayOfDate(d)); }
function dayKeyOfDate(d){
  var map = ['sun','mon','tue','wed','thu','fri','sat'];
  return map[d.getDay()];
}

function encodeState(s){
  try { return 'MMA1:' + btoa(unescape(encodeURIComponent(JSON.stringify(s)))); } catch(e){ return ''; }
}
function decodeState(code){
  code = (code||'').trim();
  if (code.indexOf('MMA1:') !== 0) return null;
  try {
    var json = decodeURIComponent(escape(atob(code.slice(5))));
    var obj = JSON.parse(json);
    if (obj && typeof obj === 'object' && obj.weeks) return obj;
  } catch(e){}
  return null;
}
function mergeStates(a, b){
  var weeks = {};
  var weekKeys = Object.keys(a.weeks||{}).concat(Object.keys(b.weeks||{}));
  weekKeys.forEach(function(wk){
    if (weeks[wk]) return;
    var aw = (a.weeks && a.weeks[wk]) || {};
    var bw = (b.weeks && b.weeks[wk]) || {};
    var days = {};
    var dayKeys = Object.keys(aw).concat(Object.keys(bw));
    dayKeys.forEach(function(dk){
      if (days[dk]) return;
      var ad = aw[dk] || {}; var bd = bw[dk] || {};
      var items = {};
      var itemKeys = Object.keys(ad).concat(Object.keys(bd));
      itemKeys.forEach(function(ik){ items[ik] = !!ad[ik] || !!bd[ik]; });
      days[dk] = items;
    });
    weeks[wk] = days;
  });
  var notes = {};
  var noteWeekKeys = Object.keys(a.notes||{}).concat(Object.keys(b.notes||{}));
  noteWeekKeys.forEach(function(wk){
    if (notes[wk]) return;
    var aw = (a.notes && a.notes[wk]) || {};
    var bw = (b.notes && b.notes[wk]) || {};
    var days = {};
    var dayKeys = Object.keys(aw).concat(Object.keys(bw));
    dayKeys.forEach(function(dk){
      if (days[dk]) return;
      var ad = aw[dk] || {}; var bd = bw[dk] || {};
      var items = {};
      var itemKeys = Object.keys(ad).concat(Object.keys(bd));
      itemKeys.forEach(function(ik){ items[ik] = ad[ik] || bd[ik] || ''; });
      days[dk] = items;
    });
    notes[wk] = days;
  });
  var overrides = {};
  var ovWeekKeys = Object.keys(a.overrides||{}).concat(Object.keys(b.overrides||{}));
  ovWeekKeys.forEach(function(wk){
    if (overrides[wk]) return;
    var aw = (a.overrides && a.overrides[wk]) || {};
    var bw = (b.overrides && b.overrides[wk]) || {};
    var days = {};
    var dayKeys = Object.keys(aw).concat(Object.keys(bw));
    dayKeys.forEach(function(dk){
      if (days[dk]) return;
      var av = aw[dk], bv = bw[dk];
      days[dk] = (av==='yes'||bv==='yes') ? 'yes' : (av||bv);
    });
    overrides[wk] = days;
  });
  return {weeks: weeks, notes: notes, overrides: overrides};
}

  syncStatusTimer = setTimeout(function(){ syncStatus=''; render(); }, 2500);

function dateOfWeekDay(weekKey, dayKey){
  var monday = new Date(weekKey+'T00:00:00');
  var offset = DAY_ORDER.indexOf(dayKey);
  return new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+offset);
}
function getDayPlan(weekKey, dayKey){
  var iso = isoDate(dateOfWeekDay(weekKey, dayKey));
  if (iso >= TRAVEL_START && iso <= TRAVEL_END && TRAVEL_PLAN[iso]) return TRAVEL_PLAN[iso];
  return PLAN[dayKey];
}
function allItemsOfDay(weekKey, dayKey){
  var out = [];
  getDayPlan(weekKey, dayKey).blocks.forEach(function(b){ b.items.forEach(function(it){ out.push(it); }); });
  return out;
}
function dayChecks(weekKey, dayKey){
  return (state.weeks[weekKey] && state.weeks[weekKey][dayKey]) || {};
}
function dayOverride(weekKey, dayKey){
  return (state.overrides && state.overrides[weekKey] && state.overrides[weekKey][dayKey]) || '';
}
function dayProgress(weekKey, dayKey){
  var items = allItemsOfDay(weekKey, dayKey);
  var checks = dayChecks(weekKey, dayKey);
  var done = 0;
  items.forEach(function(it){ if (checks[it.id]) done++; });
  return {done:done, total: items.length};
}
function weekProgress(weekKey){
  var done=0, total=0;
  DAY_ORDER.forEach(function(dk){
    var p = dayProgress(weekKey, dk);
    done += p.done; total += p.total;
  });
  return {done:done, total:total};
}
function fmtRange(monday){
  var sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()+6);
  var months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return monday.getDate()+' '+months[monday.getMonth()]+' – '+sunday.getDate()+' '+months[sunday.getMonth()];
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function checkSvg(){ return '<svg viewBox="0 0 16 16" width="12" height="12"><path d="M2 8.5 6 12l8-8" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

function renderHistory(currentWeekKey){
  var keys = Object.keys(state.weeks).filter(function(k){ return k !== currentWeekKey; }).sort().reverse().slice(0,4);
  if (!keys.length) return '';
  var bars = keys.map(function(k){
    var wp = weekProgress(k);
    var pct = wp.total ? Math.round(wp.done/wp.total*100) : 0;
    var d = new Date(k+'T00:00:00');
    var label = d.getDate()+'/'+(d.getMonth()+1);
    return '<div class="hbar"><div class="hbar-track"><div class="hbar-fill" style="height:'+pct+'%"></div></div><div class="hbar-label">'+label+'</div></div>';
  }).join('');
  return '<section class="history"><div class="history-title">Semanas anteriores</div><div class="history-row">'+bars+'</div></section>';
}

function dayNotes(weekKey, dayKey){
  return (state.notes && state.notes[weekKey] && state.notes[weekKey][dayKey]) || {};
}

function renderBlock(dayKey, weekKey, block){
  var checks = dayChecks(weekKey, dayKey);
  var notes = dayNotes(weekKey, dayKey);
  var items = block.items.map(function(it){
    var checked = !!checks[it.id];
    var video = it.v ? VIDEOS[it.v] : null;
    var vidBtn = '';
    if (it.v){
      if (video) vidBtn = '<button class="vidbtn" data-video="'+it.v+'" data-title="'+escapeHtml(video.title)+'">▶ Ver</button>';
      else vidBtn = '<button class="vidbtn pending" disabled>Video pendiente</button>';
    }
    var row = '<div class="item'+(checked?' checked':'')+'">'+
      '<span class="box" data-toggle="'+dayKey+':'+it.id+'" role="checkbox" aria-checked="'+checked+'" tabindex="0">'+(checked?checkSvg():'')+'</span>'+
      '<span class="item-text" data-toggle="'+dayKey+':'+it.id+'">'+escapeHtml(it.text)+'</span>'+
      vidBtn+
    '</div>';
    if (it.note){
      var noteVal = notes[it.id] || '';
      row += '<textarea class="note-input" data-note="'+dayKey+':'+it.id+'" placeholder="Qué funcionó / qué falló / ajuste para la próxima...">'+escapeHtml(noteVal)+'</textarea>';
    }
    return row;
  }).join('');
  return '<section class="block"><div class="block-title">'+block.title+'</div><div class="items">'+items+'</div></section>';
}

function dayColorClass(date, today){
  if (date.getTime() > today.getTime()) return 'future';
  var weekKey = weekKeyOfDate(date);
  var dayKey = dayKeyOfDate(date);
  if (dayOverride(weekKey, dayKey) === 'yes') return 'green';
  var p = dayProgress(weekKey, dayKey);
  if (!p.total) return 'future';
  var pct = p.done/p.total*100;
  if (pct >= 100) return 'green';
  if (pct > 50) return 'yellow';
  if (pct > 15) return 'orange';
  if (pct > 0) return 'red';
  return 'none';
}

function renderYearGrid(){
  var start = mondayOfDate(new Date());
  var today = new Date(); today.setHours(0,0,0,0);
  var totalDays = 365;
  var cols = Math.ceil(totalDays/7);
  var monthNames = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var monthsHtml = '';
  var colsHtml = '';
  var lastMonth = -1;
  for (var c=0; c<cols; c++){
    var colFirstDate = new Date(start.getFullYear(), start.getMonth(), start.getDate()+c*7);
    var label = '';
    if (colFirstDate.getMonth() !== lastMonth){
      label = monthNames[colFirstDate.getMonth()];
      lastMonth = colFirstDate.getMonth();
    }
    monthsHtml += '<div class="year-month-label">'+label+'</div>';
    var cellsHtml = '';
    for (var r=0;r<7;r++){
      var idx = c*7+r;
      if (idx>=totalDays){ cellsHtml += '<div class="ycell empty"></div>'; continue; }
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+idx);
      var cls = d.getTime() < today.getTime() ? 'empty' : dayColorClass(d, today);
      var lbl = d.getDate()+' '+monthNames[d.getMonth()];
      cellsHtml += '<div class="ycell '+cls+'" title="'+lbl+'"></div>';
    }
    colsHtml += '<div class="ycol">'+cellsHtml+'</div>';
  }
  return '<div class="year-scroll"><div class="year-months">'+monthsHtml+'</div><div class="year-grid">'+colsHtml+'</div></div>'+
    '<div class="year-legend">'+
      '<span class="ycell none"></span> 0%'+
      '<span class="ycell red"></span> 1-15%'+
      '<span class="ycell orange"></span> 16-50%'+
      '<span class="ycell yellow"></span> 51-99%'+
      '<span class="ycell green"></span> 100%'+
      '<span class="ycell future"></span> por venir'+
    '</div>';
}

      '<button class="nav" data-nav="prev" aria-label="Semana anterior">‹</button>'+
      '<div class="weekrange">'+fmtRange(monday)+'</div>'+

        '<circle cx="70" cy="70" r="58" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+ringCirc.toFixed(1)+'" stroke-dashoffset="'+ringOffset.toFixed(1)+'" transform="rotate(-90 70 70)" class="ring-progress"/>'+
      '</svg>'+

function toggle(dayKey, itemId){
  var weekKey = weekKeyForOffset(ui.weekOffset);
  if (!state.weeks[weekKey]) state.weeks[weekKey] = {};
  if (!state.weeks[weekKey][dayKey]) state.weeks[weekKey][dayKey] = {};
  state.weeks[weekKey][dayKey][itemId] = !state.weeks[weekKey][dayKey][itemId];
  saveState();
  sbPush();
  render();
}

function openVideo(key, title){
  var v = VIDEOS[key];
  if (!v) return;
  document.getElementById('modalTitle').textContent = title || 'Técnica';
  document.getElementById('modalBody').innerHTML = '<iframe src="https://www.youtube.com/embed/'+v.id+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  document.getElementById('modalBackdrop').hidden = false;
}
function closeVideo(){
  document.getElementById('modalBackdrop').hidden = true;
  document.getElementById('modalBody').innerHTML = '';
}

var appEl = document.getElementById('app');
appEl.addEventListener('click', function(e){
  if (e.target.id === 'syncOut'){ e.target.select(); return; }
  var syncToggle = e.target.closest('[data-sync-toggle]');
  if (syncToggle){ syncOpen = !syncOpen; render(); return; }
  var yearToggle = e.target.closest('[data-year-toggle]');
  if (yearToggle){ yearOpen = !yearOpen; render(); return; }
  var ovBtn = e.target.closest('[data-override]');
  if (ovBtn){
    var ovParts = ovBtn.getAttribute('data-override').split(':');
    var ovDay = ovParts[0], ovVal = ovParts[1];
    var ovWeekKey = weekKeyForOffset(ui.weekOffset);
    if (!state.overrides) state.overrides = {};
    if (!state.overrides[ovWeekKey]) state.overrides[ovWeekKey] = {};
    var current = state.overrides[ovWeekKey][ovDay];
    state.overrides[ovWeekKey][ovDay] = (current === ovVal) ? '' : ovVal;
    saveState();
    sbPush();
    render();
    return;
  }
  if (e.target.id === 'syncCopyBtn'){
    var code = encodeState(state);
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(function(){
        flashStatus('Copiado ✓'); render();
      }).catch(function(){
        var ta = document.getElementById('syncOut'); if (ta) ta.select();
        flashStatus('No se pudo copiar solo — selecciona el texto y cópialo'); render();
      });
    } else {
      var ta2 = document.getElementById('syncOut'); if (ta2) ta2.select();
      flashStatus('Selecciona el texto y cópialo'); render();
    }
    return;
  }
  if (e.target.id === 'syncImportBtn'){
    var input = document.getElementById('syncIn');
    var decoded = decodeState(input ? input.value : '');
    if (!decoded){ flashStatus('Código inválido'); render(); return; }
    state = mergeStates(state, decoded);
    saveState();
    sbPush();
    flashStatus('Progreso combinado ✓');
    render();
    return;
  }
  var navBtn = e.target.closest('[data-nav]');
  if (navBtn){
    ui.weekOffset += navBtn.getAttribute('data-nav')==='next' ? 1 : -1;
    if (ui.weekOffset > 52) ui.weekOffset = 52;
    if (ui.weekOffset < -52) ui.weekOffset = -52;
    saveUI(); render(); return;
  }
  var dayBtn = e.target.closest('[data-day]');
  if (dayBtn){ ui.dayKey = dayBtn.getAttribute('data-day'); saveUI(); render(); return; }
  var vidBtn = e.target.closest('[data-video]');
  if (vidBtn && !vidBtn.disabled){ openVideo(vidBtn.getAttribute('data-video'), vidBtn.getAttribute('data-title')); return; }
  var toggleEl = e.target.closest('[data-toggle]');
  if (toggleEl){
    var parts = toggleEl.getAttribute('data-toggle').split(':');
    toggle(parts[0], parts[1]);
  }
});
appEl.addEventListener('input', function(e){
  var noteEl = e.target.closest('[data-note]');
  if (!noteEl) return;
  var parts = noteEl.getAttribute('data-note').split(':');
  var dk = parts[0], ik = parts[1];
  var weekKey = weekKeyForOffset(ui.weekOffset);
  if (!state.notes) state.notes = {};
  if (!state.notes[weekKey]) state.notes[weekKey] = {};
  if (!state.notes[weekKey][dk]) state.notes[weekKey][dk] = {};
  state.notes[weekKey][dk][ik] = noteEl.value;
  saveState();
  sbPush();
});
appEl.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var toggleEl = e.target.closest('[data-toggle]');
  if (toggleEl){
    e.preventDefault();
    var parts = toggleEl.getAttribute('data-toggle').split(':');
    toggle(parts[0], parts[1]);
  }
});
document.getElementById('modalClose').addEventListener('click', closeVideo);
document.getElementById('modalBackdrop').addEventListener('click', function(e){
  if (e.target.id === 'modalBackdrop') closeVideo();
});

if (sb) { sbInit(); } else { render(); }
</script>
</body>
</html>
